[project]
name = "invest-system"
version = "0.1.0"
description = "Hệ thống phân tích cơ hội đầu tư cổ phiếu Việt Nam: vĩ mô → ngành → doanh nghiệp → định giá → PDF"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

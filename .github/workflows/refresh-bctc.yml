name: Refresh annual financial statements

on:
  workflow_dispatch:
  schedule:
    - cron: "23 20 * * 0"

permissions:
  contents: write

concurrency:
  group: refresh-bctc
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -r requirements.txt "vnstock>=4.0.6"
      - name: Fetch UPCOM and missing HOSE/HNX statements
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BLOB_BASE_URL: ${{ secrets.BLOB_BASE_URL }}
        run: |
          python scripts/fetch_bctc_vnstock.py --exchange UPCOM --resume --upload
          python scripts/fetch_bctc_vnstock.py --exchange HOSE --resume --upload
          python scripts/fetch_bctc_vnstock.py --exchange HNX --resume --upload
          python scripts/check_bctc_coverage.py
      - name: Persist checkpoints and coverage report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webdata/bctc_coverage.json docs/bctc-coverage.md
          git diff --cached --quiet || git commit -m "data: refresh annual financial statements"
          git push

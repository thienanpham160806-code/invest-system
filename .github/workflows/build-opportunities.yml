name: Build opportunity ranking snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "45 22 * * 0"

permissions:
  contents: write

concurrency:
  group: build-opportunities
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BLOB_BASE_URL: ${{ secrets.BLOB_BASE_URL }}
      LLM_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_opportunities.py --resume
      - name: Store full ranked snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webdata/snapshot/opportunities.json docs/opportunity-audit.md
          git diff --cached --quiet || git commit -m "data: refresh opportunity ranking snapshot"
          git push
